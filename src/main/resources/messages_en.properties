# Home (landing page)
appjars.processmanagerdemo.demo.home.title=Process Manager Demo
appjars.processmanagerdemo.demo.home.hero.title=Process Manager
appjars.processmanagerdemo.demo.home.hero.tagline=Schedule, run and monitor background processes from your application tasks, and keep a full history of every execution — all managed from a single view.
appjars.processmanagerdemo.demo.home.features.title=What's inside
appjars.processmanagerdemo.demo.home.features.scheduling.title=Cron scheduling
appjars.processmanagerdemo.demo.home.features.scheduling.desc=Schedule any process with cron expressions, either picking a common preset or writing your own, with a plain-language description of when it will run.
appjars.processmanagerdemo.demo.home.features.execute.title=Run on demand
appjars.processmanagerdemo.demo.home.features.execute.desc=Trigger any process immediately with "Execute now", independently of its schedule.
appjars.processmanagerdemo.demo.home.features.history.title=Execution history
appjars.processmanagerdemo.demo.home.features.history.desc=Review every run with start and end times and duration, and filter the records by when they ran.
appjars.processmanagerdemo.demo.home.features.control.title=Schedule control
appjars.processmanagerdemo.demo.home.features.control.desc=Pause, resume or clear a process schedule at any time without deleting the process.
appjars.processmanagerdemo.demo.home.features.status.title=Live status
appjars.processmanagerdemo.demo.home.features.status.desc=See at a glance the schedule status (enabled, paused, unscheduled) and execution status (running, ready) of every process.
appjars.processmanagerdemo.demo.home.features.crud.title=Process management
appjars.processmanagerdemo.demo.home.features.crud.desc=Create, edit and delete processes in a grid with server-side sorting and filtering by name and status.
appjars.processmanagerdemo.demo.home.features.responsive.title=Responsive design
appjars.processmanagerdemo.demo.home.features.responsive.desc=Views adapt to mobile, tablet and desktop screen sizes out of the box.
appjars.processmanagerdemo.demo.home.features.yourtasks.title=Runs your own code
appjars.processmanagerdemo.demo.home.features.yourtasks.desc=Any Spring-managed Runnable in your application becomes assignable tasks to a process — you write the job, Process Manager schedules and monitors it.
appjars.processmanagerdemo.demo.home.tryit.title=Try it now
appjars.processmanagerdemo.demo.home.tryit.intro=This demo needs no login: open the Processes view below and start scheduling, running and monitoring right away. It also ships with a few sample tasks to try, listed below.
appjars.processmanagerdemo.demo.home.tryit.tasks.reminder=Logs a reminder message each time it runs — a stand-in for jobs like sending notifications.
appjars.processmanagerdemo.demo.home.tryit.tasks.server=Logs a generic server-side job — a stand-in for routine maintenance work.
appjars.processmanagerdemo.demo.home.tryit.tasks.updateservice=Simulates ~1.5s of work — powers the seeded "Service update" process.
appjars.processmanagerdemo.demo.home.tryit.processes=Open Processes Menu
appjars.processmanagerdemo.demo.home.tour.button=Guided tour
appjars.processmanagerdemo.demo.home.tour.thispage=This page
appjars.processmanagerdemo.demo.home.tour.processes=Processes Menu
appjars.processmanagerdemo.demo.home.license.title=Free vs. full license
appjars.processmanagerdemo.demo.home.license.desc=This demo runs in free mode: every feature is fully functional, limited to 1 process in total. A full license removes the limit — nothing else changes.
appjars.processmanagerdemo.demo.home.license.link=Get a license at appjars.com
appjars.processmanagerdemo.demo.home.links.title=Learn more
appjars.processmanagerdemo.demo.home.links.github=AppJars on GitHub
appjars.processmanagerdemo.demo.home.links.readme=Process Manager documentation

# Guided tours
appjars.processmanagerdemo.demo.tour.btn.next=Next
appjars.processmanagerdemo.demo.tour.btn.back=Back
appjars.processmanagerdemo.demo.tour.btn.done=Done
appjars.processmanagerdemo.demo.tour.processes.intro.title=Process Manager view
appjars.processmanagerdemo.demo.tour.processes.intro.desc=This is the view the appjar adds to your application: everything needed to schedule, run and monitor your processes, with no code of your own beyond the tasks themselves. Let's go through it.
appjars.processmanagerdemo.demo.tour.processes.grid.title=Process list
appjars.processmanagerdemo.demo.tour.processes.grid.desc=Every process is listed with its schedule, its schedule status and its execution status. The demo comes preloaded with one example process.
appjars.processmanagerdemo.demo.tour.processes.filters.title=Filtering
appjars.processmanagerdemo.demo.tour.processes.filters.desc=Filter the list by process name and by status to quickly find what you're looking for.
appjars.processmanagerdemo.demo.tour.processes.create.title=Create a process
appjars.processmanagerdemo.demo.tour.processes.create.desc=Use this button to create a new process: give it a name, choose the task to run and define its schedule with a cron expression (pick a common preset or write your own).
appjars.processmanagerdemo.demo.tour.processes.playpause.title=Pause / resume scheduling
appjars.processmanagerdemo.demo.tour.processes.playpause.desc=The play/pause button on each row toggles that process's schedule. Pause stops the process from running on its cron schedule (its status becomes Paused) without deleting it; play resumes scheduled execution. It does not run the process immediately — use "Execute now" in the actions menu for that.
appjars.processmanagerdemo.demo.tour.processes.actions.title=Row actions menu
appjars.processmanagerdemo.demo.tour.processes.actions.desc=The ⋮ menu groups the remaining row actions: run the process now, edit it, clear its schedule, review its execution history or delete it. Which ones are available depends on the process status.
appjars.processmanagerdemo.demo.tour.processes.finish.title=That's it
appjars.processmanagerdemo.demo.tour.processes.finish.desc=The demo ships with one example process so every feature is on show. Free mode is limited to 1 process in total, so to create your own, delete the example first — or get a full license to remove the limit entirely. Enjoy exploring Process Manager!
