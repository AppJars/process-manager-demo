# ============================================================
# Data source
# ============================================================

# Local file-backed H2 database
spring.datasource.url=jdbc:h2:./data/processmanagerdb

# Database username
spring.datasource.username=sa

# Database password
spring.datasource.password=

# Enable the H2 browser console
spring.h2.console.enabled=true

# ============================================================
# Persistence
# ============================================================

# Keep the demo schema in sync with the entities
spring.jpa.hibernate.ddl-auto=update

# Keep persistence work outside Vaadin view rendering
spring.jpa.open-in-view=false

# ============================================================
# Vaadin
# ============================================================

# Load translations from messages_*.properties
vaadin.i18n.provider=com.appjars.utils.i18n.DefaultI18nProvider

# ============================================================
# Process Manager
# ============================================================

# Route of the Processes view
com.appjars.processmanager.url.process=pm/process

# Date-time format used in the execution history grid
com.appjars.processmanager.executionsdialog.datetimeformat=dd/MM/yyyy HH:mm:ss.SS

# Date format used by the execution history filters
com.appjars.processmanager.executionsdialog.dateformat=dd/MM/yyyy
